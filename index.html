<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅拍駅 — 全台鐵路車站隨機旅拍系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <!-- 導入 html2canvas 用於卡片圖片生成下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header 區 -->
    <header class="main-header">
      <div class="brand">
        <span class="badge">TRAIL & SHOT</span>
        <h1>旅拍駅 <span>車站抽選系統</span></h1>
      </div>
      <div class="stats-bar">
        <div class="header-controls">
          <button id="btn-sound-toggle" class="btn-icon">🔊 音效: 開</button>
          <button id="btn-history" class="btn-icon">📜 旅途日誌</button>
        </div>
        <div class="stat-items-group">
          <span>剩餘站點：<strong id="remaining-count">--</strong> / <span id="total-count">--</span></span>
          <span>已造訪：<strong id="visited-count">0</strong></span>
        </div>
      </div>
    </header>

    <!-- 核心時刻表看板區 -->
    <main class="drawing-stage">
      
      <!-- 抽選偏好篩選器 -->
      <div class="filter-bar">
        <label for="filter-region">⚙️ 抽選範圍：</label>
        <select id="filter-region">
          <option value="ALL">全台灣車站 (全選)</option>
          <option value="NORTH">北部區域 (基隆/台北/新竹等)</option>
          <option value="CENTRAL">中部區域 (苗栗/台中/彰化等)</option>
          <option value="SOUTH">南部區域 (雲林/嘉義/台南/高雄等)</option>
          <option value="EAST">東部區域 (宜蘭/花蓮/台東等)</option>
          <option value="SECRET">🌿 秘境與支線小站</option>
          <option value="MAJOR">🚉 主要交通大站</option>
        </select>
      </div>

      <div class="flip-board-container">
        <div class="board-header">
          <span class="board-title">▲ 下一站目的地 ▲</span>
          <span class="status-indicator" id="board-status">STANDBY</span>
        </div>
        
        <div class="flip-board">
          <div class="flip-column">
            <span class="column-label">LINE 路線</span>
            <div class="flip-card" id="flip-line"><div class="flip-inner">——</div></div>
          </div>
          <div class="flip-column">
            <span class="column-label">CODE 代碼</span>
            <div class="flip-card" id="flip-code"><div class="flip-inner">0000</div></div>
          </div>
          <div class="flip-column main-station">
            <span class="column-label">STATION 車站</span>
            <div class="flip-card" id="flip-name"><div class="flip-inner">ready</div></div>
          </div>
        </div>
      </div>

      <!-- 按鈕區 -->
      <div class="action-area">
        <button id="btn-draw" class="shutter-button">
          <span class="camera-icon">📸</span>
          <span class="btn-text">按下快門抽選</span>
        </button>

        <div class="go-official-wrapper">
          <a href="https://www.trc.com.tw/tra-tip-web/tip" target="_blank" rel="noopener noreferrer" class="btn-go-official">
            🚆 準備出發!
          </a>
          <span class="sub-note">找個良辰吉日出發吧</span>
        </div>
      </div>
    </main>
  </div>

  <!-- 彈出式車站資訊卡片 -->
  <div id="result-modal" class="modal-overlay hidden">
    <div class="polaroid-card-wrapper">
      <div class="polaroid-card" id="capture-card">
        <div class="station-header-bar">
          <span class="photo-tag" id="modal-tag">路線 | 代碼</span>
          <span class="tap-hint">💡 點擊背景空白處返回</span>
        </div>

        <div class="polaroid-caption">
          <h2 id="modal-station-title">車站名稱</h2>
          <p class="location-text" id="modal-location">📍 路線與代碼</p>
          
          <div class="info-section">
            <h3>📷 周邊拍攝地點</h3>
            <ul id="modal-photo-spots"></ul>
          </div>

          <div class="info-section">
            <h3>🍜 在地簡易美食</h3>
            <ul id="modal-food-spots"></ul>
          </div>
        </div>

        <div class="card-footer-watermark">
          <span>TRAIL & SHOT 旅拍駅</span>
        </div>
      </div>

      <button id="btn-save-card" class="btn-save-image">📸 下載旅拍卡片 (IG分享)</button>
    </div>
  </div>

  <!-- 歷史紀錄側邊欄與成就徽章 -->
  <div id="history-modal" class="modal-overlay hidden">
    <div class="history-panel" onclick="event.stopPropagation()">
      <div class="panel-header">
        <h2>📜 旅途日誌 & 成就勳章</h2>
        <button id="btn-close-history" class="btn-close">×</button>
      </div>

      <!-- 成就勳章展示區 -->
      <div class="achievements-section">
        <h3>🏅 巡禮勳章</h3>
        <div class="badges-grid" id="badges-container"></div>
      </div>

      <div class="history-list-section">
        <h3>🚉 已造訪車站紀錄</h3>
        <ul id="history-list" class="history-list"></ul>
      </div>

      <div class="panel-footer">
        <button id="btn-reset" class="btn-danger">🔄 重置造訪紀錄（重新環島）</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
